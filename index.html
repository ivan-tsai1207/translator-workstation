    <meta charset="UTF-8" />

    <title>翻譯工作站 · UI 預覽</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;
        background: #F2F8FB;
        color: #2A3942;

      }
      kbd {
        display: inline-block;
        padding: 2px 6px;
        font-size: 11px;
        background: #DEEDF4;
        color: #2A3942;
        border: 0.5px solid rgba(42,57,66,0.16);
        border-radius: 4px;
        line-height: 1;
        font-family: inherit;
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: rgba(42,57,66,0.16); border-radius: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
